<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body { background: var(--app-bg); color: var(--text); -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
  #root { height: 100%; }
  ::selection { background: color-mix(in srgb, var(--link) 26%, transparent); }

  /* quiet scrollbars to match the calm chrome */
  *::-webkit-scrollbar { width: 11px; height: 11px; }
  *::-webkit-scrollbar-thumb { background: color-mix(in srgb, var(--muted) 38%, transparent); border-radius: 999px; border: 3px solid transparent; background-clip: content-box; }
  *::-webkit-scrollbar-thumb:hover { background: color-mix(in srgb, var(--muted) 60%, transparent); background-clip: content-box; }
  *::-webkit-scrollbar-track { background: transparent; }

  /* find highlights */
  .find-hit { background: color-mix(in srgb, var(--accent-warning) 36%, transparent); border-radius: 2px; color: inherit; }
  .find-hit--active { background: var(--accent-warning); color: #1a1300; }
  :root[data-theme="dark"] .find-hit--active { color: #1a1300; }

  a { color: var(--link); }
  kbd { font-family: var(--font-sans); }

  @media (prefers-reduced-motion: reduce) {
    * { scroll-behavior: auto !important; transition: none !important; }
  }
</style>
</head>
