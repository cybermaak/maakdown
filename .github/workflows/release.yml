name: Release

# Publishes the UNSIGNED Windows and Linux artifacts to a GitHub Release.
# Push a version tag (e.g. v0.1.0) to build both and attach them to the release.
# workflow_dispatch builds + uploads workflow artifacts only (no Release), for
# dry runs.
#
# macOS is intentionally NOT built here. The signed + notarized macOS .dmg/.zip
# are produced locally on the maintainer's Mac via scripts/release-mac.sh (it
# uploads to the same tag's Release with --clobber). See docs/RELEASING.md.
# Windows signing (scripts/sign-windows.ps1) is staged for when a certificate is
# available; until then Windows builds are unsigned and may show SmartScreen.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build (${{ matrix.label }})
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Windows
            os: windows-2022
          - label: Linux
            os: ubuntu-22.04
    runs-on: ${{ matrix.os }}
    env:
      VERSION: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Install Linux WebKit dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libgtk-3-dev libwebkit2gtk-4.0-dev

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0

      - name: Build unsigned native application
        shell: bash
        # Inject the tag so the in-app About dialog reports the release version.
        run: '"$(go env GOPATH)/bin/wails" build -clean -ldflags "-X main.appVersion=${VERSION}"'

      - name: Verify native build artifact
        shell: bash
        run: scripts/verify-build-artifact.sh

      - name: Package distributable
        id: package
        shell: bash
        run: scripts/package-artifact.sh

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: maakdown-${{ runner.os }}-${{ runner.arch }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: List artifacts
        run: ls -la dist

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # This job does not check out the repo, so point gh at the repository
          # explicitly — otherwise gh tries (and fails) to infer it from git.
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          notes="The macOS .dmg/.zip are signed with a Developer ID and notarized, uploaded separately by the maintainer (see docs/RELEASING.md). Windows and Linux builds are unsigned. Windows may show a SmartScreen warning until signed artifacts are available."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --title "$TAG" --generate-notes --notes "$notes"
          fi
