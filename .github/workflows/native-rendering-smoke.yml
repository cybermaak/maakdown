name: Native rendering screenshots

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-rendering-screenshots-${{ github.ref }}
  cancel-in-progress: true

jobs:
  capture:
    name: Capture (${{ matrix.label }})
    continue-on-error: true
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS WKWebView
            os: macos-14
            script: scripts/capture-native-macos.sh
          - label: Windows WebView2
            os: windows-2022
            script: scripts/capture-native-windows.ps1
          - label: Linux WebKitGTK
            os: ubuntu-22.04
            script: scripts/capture-native-linux.sh
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install Linux native dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential imagemagick libgtk-3-dev libwebkit2gtk-4.0-dev \
            pkg-config xvfb

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.11.0

      - name: Build unsigned native application
        shell: bash
        run: '"$(go env GOPATH)/bin/wails" build -clean'

      - name: Capture macOS native screenshots
        if: runner.os == 'macOS'
        shell: bash
        run: scripts/capture-native-macos.sh

      - name: Capture Windows native screenshots
        if: runner.os == 'Windows'
        shell: pwsh
        run: scripts/capture-native-windows.ps1

      - name: Capture Linux native screenshots
        if: runner.os == 'Linux'
        shell: bash
        run: xvfb-run -a -s "-screen 0 1440x1000x24" scripts/capture-native-linux.sh

      - name: List captured images
        shell: bash
        run: |
          ls -lh output/native-screenshots
          test "$(find output/native-screenshots -name '*.png' | wc -l | tr -d ' ')" = "2"

      - name: Upload native screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-rendering-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}
          path: output/native-screenshots/
          if-no-files-found: error
          retention-days: 7
