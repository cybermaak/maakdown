name: Cross-platform release smoke

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cross-platform-release-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and verify (${{ matrix.label }})
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS
            os: macos-14
          - label: Windows
            os: windows-2022
          - label: Linux
            os: ubuntu-22.04
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install Linux WebKit dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libgtk-3-dev libwebkit2gtk-4.0-dev

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Verify frontend
        working-directory: frontend
        run: |
          npm run test
          npm run check
          npm run build

      - name: Verify Go packages
        run: go test ./...

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.11.0

      - name: Build unsigned native application
        shell: bash
        run: '"$(go env GOPATH)/bin/wails" build -clean'

      - name: Verify native build artifact
        shell: bash
        run: scripts/verify-build-artifact.sh

      - name: Upload unsigned smoke artifact
        uses: actions/upload-artifact@v4
        with:
          name: maakdown-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}
          path: build/bin/
          if-no-files-found: error
          retention-days: 3
