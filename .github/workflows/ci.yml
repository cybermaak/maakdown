name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Check frontend
        working-directory: frontend
        run: |
          npm run test
          npm run check
      - name: Build frontend
        working-directory: frontend
        run: npm run build
      - name: Install benchmark browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Run reader benchmark
        working-directory: frontend
        run: |
          npm run benchmark
          npm run benchmark:workspace
      - name: Run visual smoke
        working-directory: frontend
        run: npm run visual-smoke

  # Cross-platform visual verification: capture key reader scenarios on macOS,
  # Windows, and Linux (production benchmark bundle, headless Chromium) and
  # publish them as per-OS artifacts so the app's rendering can be reviewed.
  uat-screenshots:
    needs: frontend
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Install Playwright Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Capture key-scenario screenshots
        working-directory: frontend
        env:
          MAAKDOWN_SHOT_OUTDIR: ${{ github.workspace }}/uat-screenshots
        run: node scripts/capture-readme-screenshots.mjs
      - name: Upload UAT screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: uat-screenshots-${{ matrix.os }}
          path: uat-screenshots/
          if-no-files-found: error
          retention-days: 14

  # Functional UAT suite runs on macOS, Windows, and Linux.
  uat:
    needs: frontend
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Install Playwright Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Run UI-driven UAT suite
        working-directory: frontend
        run: npm run uat
      - name: Upload UAT failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: uat-failure-artifacts-${{ matrix.os }}
          path: |
            frontend/uat-results/
            frontend/test-results/
          retention-days: 7
          if-no-files-found: ignore

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Test Go packages
        run: go test ./...
